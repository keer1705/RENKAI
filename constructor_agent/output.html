<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App</title>
<style>
:root{
  --bg:#0f172a;
  --bg2:#1e293b;
  --card:rgba(30,41,59,.75);
  --accent:#8b5cf6;
  --accent2:#6366f1;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Inter,system-ui,sans-serif;
    background:
    radial-gradient(circle at top left,#4338ca 0%,transparent 35%),
    radial-gradient(circle at bottom right,#3c1d72 0%,transparent 30%),
    var(--bg);
    color:var(--text);
    padding:40px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
    font-weight:800;
    background:linear-gradient(90deg,#341a70,#3b82f6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

#note-form{
    max-width:850px;
    margin:0 auto 40px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(15px);
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

#note-input{
    width:100%;
    min-height:150px;
    border:none;
    outline:none;
    resize:vertical;
    background:var(--bg2);
    color:var(--text);
    border-radius:15px;
    padding:18px;
    font-size:16px;
    line-height:1.6;
}

#note-input::placeholder{
    color:var(--muted);
}

#add-btn{
    margin-top:18px;
    float:right;
    border:none;
    padding:12px 30px;
    border-radius:12px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

#add-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37, 38, 110, 0.45);
}

#notes-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:25px;
}

.note-card{
    background:var(--card);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    transition:.35s;
    box-shadow:0 12px 25px rgba(0,0,0,.3);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.note-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 20px 35px rgba(0,0,0,.45);
}

.note-card p{
    line-height:1.7;
    font-size:15px;
    color:#e5e7eb;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:18px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.note-card button{
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:600;
    transition:.3s;
}

.edit-btn{
    background:#3b82f6;
}

.edit-btn:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

.delete-btn{
    background:#ef4444;
}

.delete-btn:hover{
    background:#dc2626;
    transform:translateY(-2px);
}

footer{
    text-align:center;
    margin-top:45px;
    color:var(--muted);
}

@media(max-width:600px){

body{
    padding:20px;
}

header h1{
    font-size:2.3rem;
}

#note-form{
    padding:18px;
}

#note-input{
    min-height:120px;
}

}
</style>
</head>
<body>
<header>
  <h1>My Notes</h1>
</header>

<section id="note-form">
  <textarea id="note-input" placeholder="Write a note..." required></textarea>
  <button id="add-btn">Add</button>
</section>

<main id="notes-container"></main>

<footer>
  <small>&copy; 2026 NotesAppUI</small>
</footer>

<script>
const notes = JSON.parse(localStorage.getItem('notes') || '[]');

function saveNotes() {
  localStorage.setItem('notes', JSON.stringify(notes));
}

function renderNotes() {
  const container = document.getElementById('notes-container');
  container.innerHTML = '';
  notes.forEach((note, index) => {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.dataset.index = index;

    const text = document.createElement('p');
    text.textContent = note.text;
    card.appendChild(text);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = 'Edit';
    actions.appendChild(editBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = 'Delete';
    actions.appendChild(deleteBtn);

    card.appendChild(actions);
    container.appendChild(card);
  });
}

function addNote(text) {
  notes.push({ text, id: Date.now() });
  saveNotes();
  renderNotes();
}

function editNote(index, newText) {
  if (newText !== null) {
    notes[index].text = newText;
    saveNotes();
    renderNotes();
  }
}

function deleteNote(index) {
  notes.splice(index, 1);
  saveNotes();
  renderNotes();
}

document.getElementById('add-btn').addEventListener('click', function(e) {
  e.preventDefault();
  const textarea = document.getElementById('note-input');
  const value = textarea.value.trim();
  if (value) {
    addNote(value);
    textarea.value = '';
  }
});

document.getElementById('notes-container').addEventListener('click', function(e) {
  const target = e.target;
  const card = target.closest('.note-card');
  if (!card) return;
  const index = Number(card.dataset.index);
  if (target.classList.contains('edit-btn')) {
    const current = notes[index].text;
    const newText = prompt('Edit your note:', current);
    if (newText !== null) {
      editNote(index, newText.trim());
    }
  } else if (target.classList.contains('delete-btn')) {
    if (confirm('Delete this note?')) {
      deleteNote(index);
    }
  }
});

renderNotes();
</script>
</body>
</html>
