functions:
  constructor_agent:
    _type: constructor_agent
    llm_name: nim_llm
    verbose: true
    description: "Builds code step-by-step from JSON plans containing project objectives and algorithm steps"
  inspector:
    _type: inspector
  current_datetime:
    _type: current_datetime

llms:
  nim_llm:
    _type: nim
    model_name: openai/gpt-oss-120b
    temperature: 0.0
    max_tokens: 2048

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names: [constructor_agent, current_datetime]
  max_iterations: 10
  verbose: true
